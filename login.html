<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In</title>
</head>
<body>
  <section id="login">
    <h1>Log In</h1>

    <form action="#" method="post">
      <p>
        <label for="login-username">Username</label><br>
        <input type="text" id="login-username" name="username" required>
      </p>

      <p>
        <label for="login-password">Password</label><br>
        <input type="password" id="login-password" name="password" required>
      </p>

      <p><button type="submit">Log In</button></p>
    </form>

    <p>Don't have an account? <a href="#signup" onclick="showSignup()">Sign up!</a></p>
  </section>

  <section id="signup" hidden>
    <h1>Sign Up</h1>

    <form action="#" method="post">
      <p>
        <label for="signup-username">Username</label><br>
        <input type="text" id="signup-username" name="new-username" required>
      </p>

      <p>
        <label for="signup-password">Password</label><br>
        <input type="password" id="signup-password" name="new-password" required>
      </p>

      <p><button type="submit">Sign Up</button></p>
    </form>

    <p><a href="#login" onclick="showLogin()">Go Back to Log In</a></p>
  </section>

  <script>
    function showSignup() {
      document.getElementById("login").hidden = true;
      document.getElementById("signup").hidden = false;
    }

    function showLogin() {
      document.getElementById("signup").hidden = true;
      document.getElementById("login").hidden = false;
    }
  </script>
</body>
</html>
